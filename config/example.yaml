# Example FIX 4.4 configuration for local development and the mock venue.
# No real credentials, private endpoints, or public listener defaults.
service:
  name: fix-multiplexer
  mode: nonproduction
  bind: 127.0.0.1
  health_bind: 127.0.0.1:8081
  max_message_bytes: 1048576
  upstream_queue_messages: 1000
  downstream_queue_messages_per_client: 1000
  startup_timeout: 15s
  shutdown_timeout: 10s
upstream:
  fix_version: FIX.4.4
  host: 127.0.0.1
  port: 9880
  sender_comp_id: MULTIPLEXER
  target_comp_id: MOCKVENUE
  store_dir: ./state/upstream
  tls_enabled: false # local mock only; verify server certificates when enabled
  # Add username/password environment or file references when required.
downstream:
  fix_version: FIX.4.4
  listen: 127.0.0.1:9879
  target_comp_id: MULTIPLEXER
  clients:
    - sender_comp_id: DEV_A
    - sender_comp_id: DEV_B
    - sender_comp_id: QA_1
  store_dir: ./state/downstream
fanout:
  mode: live-only
  app_message_types: ["8", "9", "j"] # example narrows the default fanout policy
retention:
  downstream_replay_window: 8h # older application replay requests retire the session
  upstream_replay_window: 0s # independent: no age cutoff, still subject to disk budgets
  inactive_client_ttl: 168h
  prune_active_sessions: false
  disk_warn_bytes: 1073741824
  disk_limit_bytes: 2147483648
  session_limit_bytes: 67108864
logging:
  mode: metadata
  redact_tags: ["89", "91", "96", "553", "554", "925", "1402", "1404"]
